services:
  - type: web
    name: cc-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: FRONTEND_ORIGIN
        value: https://ai-card-recommender.vercel.app
